name: 거래 백엔드 미니PC 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, trade-backend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 백엔드 이미지 빌드 및 배포
        shell: bash
        run: |
          container=trade-backtest-api
          network=trade-server-backend_default
          test -r /home/joon/trade-server-backend/.env
          test "$(docker inspect --format '{{.State.Running}} {{index .Config.Labels "com.docker.compose.service"}}' "$container")" = 'true trade-api'
          project=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container")
          case "$project" in
            trade-server-backend|trade-backend-release-*) ;;
            *) echo '예상하지 못한 Compose 프로젝트입니다.' >&2; exit 1 ;;
          esac
          test "$(docker inspect --format '{{range $name, $settings := .NetworkSettings.Networks}}{{$name}}{{println}}{{end}}' "$container")" = "$network"
          test "$(docker inspect --format '{{len .Mounts}}' "$container")" = 0
          test "$(docker port "$container" 8000/tcp)" = 127.0.0.1:8000
          previous_container=$(docker inspect --format '{{.Id}}' "$container")
          release_project="trade-backend-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backup_container="$container-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          candidate_image="trade-backend-deploy:$GITHUB_SHA"
          docker build --tag "$candidate_image" .

          compose_file=$(mktemp)
          trap 'rm -f "$compose_file"' EXIT
          cat > "$compose_file" <<'COMPOSE'
          services:
            trade-api:
              image: ${TRADE_DEPLOY_IMAGE:?}
              container_name: trade-backtest-api
              ports:
                - "127.0.0.1:8000:8000"
              env_file:
                - /home/joon/trade-server-backend/.env
              environment:
                DRY_RUN: "true"
                ENABLE_LIVE_TRADING: "false"
              restart: unless-stopped
          networks:
            default:
              external: true
              name: trade-server-backend_default
          COMPOSE

          deploy() {
            TRADE_DEPLOY_IMAGE="$1" docker compose --env-file /dev/null \
              -p "$release_project" -f "$compose_file" \
              up -d --no-deps --no-build --pull never trade-api
          }

          healthy() {
            for attempt in {1..15}; do
              if curl -fsS --max-time 5 \
                --resolve trade-server.duckdns.org:443:127.0.0.1 \
                https://trade-server.duckdns.org/api/ |
                python3 -c 'import json, sys; r = json.load(sys.stdin); sys.exit(not (r.get("status") == "ok" and r.get("dry_run") is True))' 2>/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          docker rename "$previous_container" "$backup_container"
          if docker stop "$previous_container" && deploy "$candidate_image" && healthy; then
            docker rm "$previous_container"
            exit 0
          fi

          echo '배포 검증 실패. 기존 컨테이너를 복구합니다.' >&2
          if new_project=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container" 2>/dev/null); then
            test "$new_project" = "$release_project"
            docker rm -f "$container"
          fi
          docker rename "$previous_container" "$container"
          docker start "$previous_container"
          healthy
          exit 1
