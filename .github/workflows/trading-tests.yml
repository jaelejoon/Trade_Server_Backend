name: 매매 엔진 검증

on:
  pull_request:
  push:
    branches: ['feature/2026-11-24']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trade_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: trade_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://trade_test:isolated-test-only@localhost:5432/trade_test
      DRY_RUN: 'true'
      ENABLE_LIVE_TRADING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app scripts tests
